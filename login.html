<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign In E-File</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-panel">
        <a class="brand" href="index.html"><span>EF</span>E-File</a>
        <div class="auth-box">
            <p class="eyebrow">WELCOME BACK</p>
            <h1>Sign in to your workspace</h1>
            <p class="muted">Manage your documents from one secure dashboard.</p>
            <form id="loginForm">
                <label>Email
                    <input id="loginEmail" type="email" required placeholder="you@example.com">
                </label>
                <label>
                    Password
                    <input id="loginPassword" type="password" required placeholder="••••••••">
                </label>
                <button class="btn primary full" type="submit">Sign in</button>
                <p id="loginMsg" class="form-msg"></p>
            </form>
            <p class="switch">Don't have an account? 
                <a href="register.html">Create one</a>
            </p>
        </div>
    </div>
    <div class="auth-art">
        <div>
            <span class="art-icon">▣</span>
            <h2>Everything in its place.</h2>
            <p>Keep your documents organized, searchable and easy to access.</p>
        </div>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
